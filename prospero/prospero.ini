# prospero.ini — translated from the pi configuration in this repo
# (~/.pi/agent/models.json + settings.json + agents/) on 2026-11-01,
# against prospero master c429cd9 (fetched 2026-11-01).
#
# Install: symlink as ~/.config/prospero/prospero.ini, the same pattern
# this repo uses for ~/.pi/agent.
#
# Reference for every section and key: assets/prospero.ini in the
# prospero source tree, or Help inside the app. Unknown keys only land
# in diagnostics; nothing here can keep Prospero from starting.

# ---------------------------------------------------------------------
# Defaults for new sessions
# pi: defaultProvider = "asc", defaultModel = "moonshotai/Kimi-K3"
# ---------------------------------------------------------------------
model = asc/moonshotai/Kimi-K3.1-Pro


# ---------------------------------------------------------------------
# Endpoints (pi: providers)
# Both speak the OpenAI Chat Completions API (kind openai is default),
# so url + key is all they need. Keys stay in the environment,
# never in this file.
# ---------------------------------------------------------------------

# pi provider "asc": ISTA Nodes vLLM. Private-network address, so
# Prospero treats it as local: 1800 s until first byte, which a 1T
# model loading weights can need.
[endpoint asc]
url = https://n3029-003.musica.vie.asc/v1
key = file:~/.config/prospero/keys/ascllm.key

# pi provider "aqueduct": TU Wien Aqueduct. Note pi stores this key in
# the OPENAI_API_KEY environment variable; Prospero reads the same one.
[endpoint aqueduct]
url = https://aqueduct.ai.datalab.tuwien.ac.at/v1/
key = file:~/.config/prospero/keys/aqueduct.key


# ---------------------------------------------------------------------
# Models (pi: per-model contextWindow / maxTokens / reasoning flags)
# pi's reasoning:true needs nothing here: vLLM serves reasoning as
# reasoning_content, which is Prospero's default assumption.
# pi's compat.supportsReasoningEffort:false also matches the default:
# nothing is sent that you do not set.
# ---------------------------------------------------------------------

[model moonshotai/Kimi-K3.1-Pro]
context = 1048576
max_tokens = 16384
# If the ISTA node keeps failing, fall back to Aqueduct's largest model:
# fallback = aqueduct/glm-5.3-744b-experimental

[model glm-5.3-744b-experimental]
context = 256000
max_tokens = 8192
# Suggestion (no pi equivalent): let the cheap 35B summarize long
# conversations instead of the 744B itself.
# compactor = aqueduct/qwen-3.6-35b

[model qwen-3.8-27b]
context = 131072
max_tokens = 8192

[model qwen-3.6-35b]
context = 131072
max_tokens = 8192

[model deepseek-v4-vision-exp-284b]
context = 128000
max_tokens = 8192
vision = false  # pi says text-only input; set true if the deployment serves images

[model qwen-3.6-35b-vllm]
context = 131072
max_tokens = 8192

# pi's defaultThinkingLevel:"medium" only has a direct counterpart for
# Anthropic endpoints (effort). For vLLM servers, thinking levels are
# variants via chat-template arguments or a reasoning budget, chosen in
# the model picker, e.g.:
#
# [model kimi-quick]
# like = asc/moonshotai/Kimi-K3
# reasoning_budget = 4096
#
# [model kimi-deep]
# like = asc/moonshotai/Kimi-K3
# reasoning_budget = 65536


# ---------------------------------------------------------------------
# Roles (pi: ~/.pi/agent/agents/*.md subagents)
# A role's prompt is one line in INI, so each role points at the full
# contract file in the agentherding repo's agents/ directory and summarizes the duty;
# the subagent reads the file with its read tool.
# pi tools "read, grep, find, ls, bash" map to read grep glob shell.
# ---------------------------------------------------------------------

[role scout]
description = Read-only reconnaissance — returns compressed findings for a parent session; the engine behind "Explore …" work
prompt = You are the recon scout for the dispatching session. Read ~/src/github.com/adammccartney/agentherding/agents/scout.md and follow its contract: verified facts with file:line evidence, candidate approaches, a recommendation, then open questions. You never change anything.
tools = read grep glob shell

[role reviewer]
description = Read-only review of a diff, branch, or implementation — severity-ordered verdict
prompt = You are the code reviewer. Read ~/src/github.com/adammccartney/agentherding/agents/reviewer.md and follow its verdict format: severity-ordered issues with file:line and a one-line fix each, then APPROVE or CHANGES REQUESTED. You judge; you never edit.
tools = read grep glob shell

[role researcher]
description = Deep literature research — finds, reads, and summarizes papers on a topic; returns cited digests
prompt = You are the literature researcher. Read ~/src/github.com/adammccartney/agentherding/agents/researcher.md and follow it: search open indexes over HTTPS with curl, triage, read, and return a cited digest. You never edit anything.
tools = read grep glob shell web_search web_fetch

[role evaluator]
description = Didactic evaluator — locates the learner's blocking gap along Pólya's four phases; returns guiding feedback, never answers
prompt = You are the didactic evaluator. Read ~/src/github.com/adammccartney/agentherding/agents/evaluator.md and follow it: assess the problem, the position, the one blocking gap, its decomposition, and return guiding feedback. Never hand over answers.
tools = read grep glob shell

[role professor]
description = Big-picture teaching — composes lectures, reviews digests and the learner's writing, suggests topics
prompt = You are the professor. Read ~/src/github.com/adammccartney/agentherding/agents/professor.md and follow it: lectures with motivation first and intuition before formalism, faithful review of digests and the learner's writing, and what to study next.
tools = read grep glob shell

[role teaching-assistant]
description = Leads lab sessions — turns evaluator findings into Pólya-structured exercise sheets; never ships solutions
prompt = You are the teaching assistant. Read ~/src/github.com/adammccartney/agentherding/agents/teaching-assistant.md and follow it: design exercise sheets structured on Pólya's four phases against the evaluator's cited gap. Never solve them, never edit the learner's work.
tools = read grep glob shell

# pi's worker has no tools list (runs with everything), so no tools key.
[role worker]
description = General-purpose implementation agent — executes an approved task with minimal diffs, reports results for review
prompt = You are the implementation worker. Read ~/src/github.com/adammccartney/agentherding/agents/worker.md and follow it: read the repo's AGENTS.md and the cited sketch or todo, make the minimal diff, run what proves it, report honestly, and never commit.

# The one pattern break: this role's contract is a skill file, not
# agents/NAME.md — the procedure already lives in the ticket-triage skill.
[role triage]
description = Support-ticket triage on support.vsc.ac.at — reads Zammad via bin/zt (GET-only), checks agent-context, writes a triage note; no Zammad writes, no builds
prompt = You are the ticket-triage agent. Read ~/src/github.com/adammccartney/agentherding/skills/ticket-triage/SKILL.md and follow it for the ticket in your task: bin/zt get → articles → precedent searches → agent-context check → short note in the repo's ticket-triage/ directory, named <number>-<short-topic>.md. Triage only: never write to Zammad, never change ticket state, never build anything. bin/zt is GET-only by construction; keep every other command read-only as well.
tools = read grep glob shell write edit skill


# ---------------------------------------------------------------------
# Skills
# Reuse your pi skill set; the SKILL.md format is the same one
# Prospero reads. Note: shannon (Neovim RPC) and youtrack-sync (pi
# todo/youtrack tools) depend on pi-specific tooling and a Prospero
# agent cannot run them; commit, uv, librarian, pdf-extract, go-style
# and eb-dev are portable. If that mix bothers you, copy the portable
# ones to ~/.config/prospero/skills instead and drop this path.
# ---------------------------------------------------------------------
[skills]
paths = ~/src/github.com/adammccartney/agentherding/skills


# ---------------------------------------------------------------------
# Tools
# agentherding/bin holds the Prospero-era CLIs (zt now, yt next): on PATH
# for the agent's commands. Config lives on the host the session runs on —
# repeat this line in the VM's file once that exists (with the checkout
# present there, or bin/ installed elsewhere).
# ---------------------------------------------------------------------
[tools]
path_append = ~/src/github.com/adammccartney/agentherding/bin


# ---------------------------------------------------------------------
# UI (pi settings.json)
# ---------------------------------------------------------------------
[ui]
theme = light       # pi: "theme": "dark"
thinking = hide     # pi: "hideThinkingBlock": true
count = characters
tools = fold
font_size = 15
#fonts = ~/fonts/NotoSansCJK-Regular.ttc#2; auto
editor = nvim
notify = allow


# ---------------------------------------------------------------------
# remote settings
# ---------------------------------------------------------------------

# [host]: the engine as a background host ("prospero serve"), which
# "prospero attach" starts for a client over ssh, and reaches through a
# socket only this user may use (a named pipe on Windows). A window
# closed with "Keep running in background" makes its own process such
# a host, with a tray icon, until its sessions are done.
#
#   idle_exit  seconds the host waits with no client connected and
#              nothing running, then exits (default: 600)
#   grace      seconds the host keeps the place of a client whose
#              connection broke, and its records, for when it comes
#              back (default: 10800)
#
# [host]
# idle_exit = 3600


# [remote NAME]: an engine on another machine, reached over ssh (or in
# WSL, or by a command such as docker exec), which "prospero attach"
# starts there if none runs ("prospero connect NAME").
# The window's Hosts panel adds one, and connects to it. On Windows,
# each installed WSL distro is a remote too, by its name, with no
# section needed.
#
#   ssh     where ssh reaches the machine: [user@]host, or a Host of
#           ~/.ssh/config
#   wsl     instead of ssh, a WSL distro on this Windows machine, as
#           wsl --list names it, reached through wsl.exe
#   exec    instead of ssh, a command that runs another there, split at
#           blanks with '...' or "..." quoting (no shell): docker exec
#           -i NAME for a running container, or podman, incus or
#           kubectl alike; the machine needs /bin/sh
#   path    the prospero executable there, a path or a name on its
#           PATH (default: the engine "prospero deploy NAME" put in
#           ~/.prospero there, else prospero)
#   state   the state directory there (default: its own)
#   config  the configuration file there (default: its own)
#   deploy  when the machine has no engine, or an older one: auto to
#           deploy it unasked (default), or ask, where the Hosts pane
#           offers Deploy engine or Update engine
#   list    when the window's session list shows the host: always
#           (default), or connected, which leaves it out while it is
#           disconnected
#   subagents
#           whether the agent's task tool may start a subagent there,
#           which works under that machine's own settings and reports
#           back: yes (default) or no
#
[remote test1]
ssh = test1
deploy = auto
#
# [remote deb]
# wsl = Debian
#
# [remote fuzz]
# exec = docker exec -i fuzzbox

#  - [guard] roots for directories outside the session's own that the
#    file tools may touch without asking.
[guard]
roots = ~/agent-context; ~/.pi/agent/agents; ~/.cache/checkouts

#  - Web tools, keyless via Exa, for the researcher role:
[web]
search = searxng
url = http://127.0.0.1:8080

# ---------------------------------------------------------------------
# pi settings with no Prospero counterpart, kept here as notes:
#  - compaction reserveTokens / keepRecentTokens (+ per-model
#    overrides): Prospero compacts automatically; INI only chooses
#    which model summarizes ([model NAME] compactor).
#  - defaultTools ["+codemode"]: pi's JS-sandbox tool has no equivalent.
#  - prompts/ templates: pi prompt templates; closest Prospero idea is
#    roles, or a skill with disable-model-invocation: true.
# ---------------------------------------------------------------------

